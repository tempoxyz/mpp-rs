version: 3
rules:
  # tempoxyz/changelogs has no release tag with the `auto-merge` input yet.
  # Allow this exact commit from tempoxyz/changelogs#188 before the 7-day
  # cooldown; remove once it is tagged. The exception also skips
  # version-comment verification.
  - ignore: true
    conditions:
      - expr: |
          ActionName == "tempoxyz/changelogs" && ActionVersion == "af1c4b05ccca335f8b45223494a93312c14c4cb3"
