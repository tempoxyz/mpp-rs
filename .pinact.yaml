version: 3
rules:
  # tempoxyz/changelogs v0.11.0 is younger than the 7-day cooldown. Allow this
  # exact commit; remove after 2026-11-02. The exception also skips
  # version-comment verification.
  - ignore: true
    conditions:
      - expr: |
          ActionName matches "^tempoxyz/changelogs(/check)?$" && ActionVersion == "35288d5b399317c9412f9dd4bfaf8cccf2d22215"
  # tempoxyz/mpp-tools publishes its reusable workflows without tags, and the
  # shared AGENTS.md sync is first-party, so skip version-comment and min-age
  # checks for it. Its SHA pin is still enforced.
  - ignore: true
    conditions:
      - expr: |
          ActionName == "tempoxyz/mpp-tools/.github/workflows/agents-sync.yml"
