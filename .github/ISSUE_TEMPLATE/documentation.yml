name: Documentation
description: Report errors or gaps in the README, documentation, or examples.
labels: ['documentation']
body:
  - type: dropdown
    attributes:
      label: Type of issue
      multiple: true
      options:
        - Documentation is missing
        - Documentation is incorrect
        - Documentation is confusing
        - Example code does not work

  - type: textarea
    attributes:
      label: Description
      description: What is wrong or missing?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Location
      description: The URL or file where you found it.
    validations:
      required: true
