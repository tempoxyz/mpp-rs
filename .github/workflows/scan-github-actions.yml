name: Scan GitHub Actions

on:
  # Required checks must report for every PR, including source-only changes.
  pull_request:
  merge_group:
  push:
    branches:
      - main
    paths:
      - ".github/**"
  workflow_dispatch:
  schedule:
    - cron: "19 7 * * 1"

permissions: {}

jobs:
  scan:
    name: Scan GitHub Actions
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
    permissions:
      id-token: write
      actions: read
      contents: read
