name: Scan GitHub Actions

on:
  # Required checks must report for every PR, including source-only changes.
  pull_request:
  merge_group:
  push:
    branches:
      - main
    paths:
      - ".github/**"
  workflow_dispatch:
  schedule:
    - cron: "19 7 * * 1"

permissions: {}

jobs:
  scan:
    name: Scan GitHub Actions
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@bd66336ead0e97e3939428f526dc61fb43db0996 # 2026-09-25T20-13-44Z-bd66336e
    permissions:
      id-token: write
      actions: read
      contents: read
