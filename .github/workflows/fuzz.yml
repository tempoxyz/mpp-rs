name: Fuzz

# Runs every target once a day. Pull requests do not fuzz: without a warm
# cache the sanitizer build alone took about three minutes.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        type: number
        default: 600

env:
  CARGO_TERM_COLOR: always

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  nightly:
    name: Fuzz nightly
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          toolchain: nightly
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          workspaces: fuzz
      - name: Seed fuzz lockfile
        # The fuzz crate is its own workspace. Start it from the root lockfile
        # so it resolves the same versions as the other jobs.
        run: cp Cargo.lock fuzz/Cargo.lock
      - uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          tool: cargo-fuzz
      # A crash fails the job; the log prints the reproducer as base64.
      - name: Run every target
        run: fuzz/run-all.sh "$SECONDS_PER_TARGET"
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || 600 }}
          FUZZ_JOBS: 4
          # The prebuilt cargo-fuzz is a musl binary and defaults to its own
          # target, which sanitizers do not support.
          CARGO_FUZZ_ARGS: --target x86_64-unknown-linux-gnu
