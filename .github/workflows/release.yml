name: Release
on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 15 * * 1' # Monday 15:17 UTC

concurrency: ${{ github.workflow }}-${{ github.ref }}

# The changelog-release version PR, branch, tags, and GitHub releases are
# created with a short-lived GitHub App token minted via the github-sts
# action (authorized by .github/sts/release-pr.sts.yaml); the built-in
# GITHUB_TOKEN is not allowed to create pull requests. id-token feeds the
# STS exchange and crates.io trusted publishing.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - name: Fetch GitHub token via STS
        id: app-token
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          policy: release-pr

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Authenticate with crates.io
        uses: tempoxyz/gh-actions/vendor/rust-lang/crates-io-auth-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        id: auth

      - name: Changelogs
        uses: tempoxyz/changelogs@af1c4b05ccca335f8b45223494a93312c14c4cb3 # tempoxyz/changelogs#188 # zizmor: ignore[artipacked]
        with:
          ecosystem: rust
          conventional-commit: true
          crate-token: ${{ steps.auth.outputs.token }}
          github-token: ${{ steps.app-token.outputs.token }}
          auto-merge: ${{ github.event_name == 'schedule' }}
