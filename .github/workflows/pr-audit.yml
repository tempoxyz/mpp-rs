name: PR Audit

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened, ready_for_review]
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  # Manual `cyclops` labels stay admin-only; push audits need no label.
  authorize:
    if: github.event.action == 'labeled' && github.event.label.name == 'cyclops'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@252d87d9636b94551796b4b8a5cb4e27b8916cf6 # 2026-10-12T22-06-06Z-252d87d9
      - name: Check admin permission
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
        run: |
          PERM=$(gh api "repos/${REPOSITORY}/collaborators/${SENDER_LOGIN}/permission" --jq '.permission')
          if [[ "$PERM" != "admin" ]]; then
            echo "::error::Only admins can trigger pr-audit (got: $PERM)"
            exit 1
          fi

  pr-audit:
    needs: authorize
    if: >-
      !cancelled() &&
      contains(fromJSON('["pull_request","pull_request_target"]'), github.event_name) &&
      (needs.authorize.result == 'success' || github.event.action != 'labeled') &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      statuses: write
    uses: tempoxyz/gh-actions/.github/workflows/pr-audit.yml@252d87d9636b94551796b4b8a5cb4e27b8916cf6 # 2026-10-12T22-06-06Z-252d87d9
    with:
      audit-on-push: true
      audit-on-command: true
    secrets:
      EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
      EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
      EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}

  # Audit commands stay admin-only, matching the label path.
  pr-audit-comment:
    # Coarse prefilter; command-regex below decides what is a command.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, 'audit') &&
      (
        startsWith(github.event.comment.body, 'cyclops') ||
        startsWith(github.event.comment.body, '@decofe') ||
        startsWith(github.event.comment.body, 'derek')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@252d87d9636b94551796b4b8a5cb4e27b8916cf6 # 2026-10-12T22-06-06Z-252d87d9

      - name: Check admin permission
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          PERM=$(gh api "repos/${REPOSITORY}/collaborators/${COMMENTER}/permission" --jq '.permission')
          if [[ "$PERM" != "admin" ]]; then
            echo "::error::Only admins can trigger pr-audit (got: $PERM)"
            exit 1
          fi

      - name: Handle audit command
        uses: tempoxyz/gh-actions/actions/pr-audit-comment@252d87d9636b94551796b4b8a5cb4e27b8916cf6 # 2026-10-12T22-06-06Z-252d87d9
        with:
          command-regex: '^(?:@decofe\s+)?(?:cyclops\s+(?:private\s+)?audit|derek\s+audit)\b'
          permission-check-mode: association
          organization: tempoxyz
          events-key: ${{ secrets.EVENTS_KEY }}
          events-cert: ${{ secrets.EVENTS_CERT }}
          events-args: ${{ secrets.EVENTS_ARGS }}
          github-token: ${{ github.token }}
