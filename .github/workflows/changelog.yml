name: Changelog

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  changelog:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.96
      - name: Remove repo-local Claude settings
        run: rm -rf .claude/
      - name: Check changelog
        uses: tempoxyz/changelogs/check@74f07b39c7c85773575e32472dfd5298ec6baaf4 # master
        with:
          ai: "claude --bare -p"
          ecosystem: rust
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
