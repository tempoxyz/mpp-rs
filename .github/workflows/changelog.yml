name: Changelog

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - ".github/**"

jobs:
  changelog:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Remove repo-local Claude settings
        run: rm -rf .claude/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check changelog
        uses: tempoxyz/changelogs/check@bd50cca508d81505924dfa3997b1696ac2b7b1aa # v0.9.0
        with:
          # `--prefix` moves npm's project root out of the checkout, so the pull
          # request's `.npmrc` and `node_modules` have no say in what runs with
          # the API key.
          ai: "npx --prefix=${{ runner.temp }} -y @anthropic-ai/claude-code@2.1.220 --bare -p"
          ecosystem: rust
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
