name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

env:
  CARGO_TERM_COLOR: always
  # Line tables keep panic backtraces readable while cutting target size
  # (and so cache restore time) and link time.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          # Pull requests restore main's cache but never save their own:
          # saving cost 8-16s at the end of every job.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
      - name: Install ast-grep
        uses: tempoxyz/gh-actions/vendor/jaxxstorm/action-install-gh-release@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          repo: ast-grep/ast-grep
          tag: "0.45.0"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run ast-grep lint
        run: sg scan -c sgconfig.yml src/
      - name: Run ast-grep tests
        run: sg test -c sgconfig.yml

  typos:
    name: Typos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - name: Check for typos
        uses: tempoxyz/gh-actions/actions/typos@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          toolchain: stable
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          # Pull requests restore main's cache but never save their own:
          # saving cost 8-16s at the end of every job.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests
        run: cargo test --lib --bins --tests --features tempo,stripe,ws,server,client,axum,middleware,tower,utils,sqlite,integration-stripe,integration-ws
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      - name: Check Ring transport dependency graph
        run: |
          tree=$(cargo tree -p alloy-transport-mpp --no-default-features --features ring --edges normal --prefix none)
          if grep -q '^aws-lc-sys ' <<< "$tree"; then
            echo "Ring-only transport unexpectedly includes aws-lc-sys"
            exit 1
          fi
      - name: Check examples
        run: cargo check --workspace --exclude mpp

  doctest:
    name: Doc tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          toolchain: stable
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          # Pull requests restore main's cache but never save their own:
          # saving cost 8-16s at the end of every job.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Edition 2021 compiles each doctest separately (~15s), so they run
      # alongside the unit tests instead of after them.
      - name: Doc tests
        run: cargo test --doc --features tempo,stripe,ws,server,client,axum,middleware,tower,utils,sqlite,integration-stripe,integration-ws

  features:
    name: Features ${{ matrix.partition }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        partition: ["1/3", "2/3", "3/3"]
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          toolchain: stable
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          # rust-cache keys on the job ID, which all partitions share: only the
          # first to finish on main saved, and the others restored a target
          # directory built for different features. One cache per partition.
          key: features-${{ strategy.job-index }}
          # Pull requests restore main's cache but never save their own:
          # saving cost 8-16s at the end of every job.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          tool: cargo-hack
      # The TLS backends only select reqwest's TLS stack, so pairing them with
      # every other feature adds ~60 checks that test nothing new. They are
      # checked once each with the client below.
      - name: Check feature combinations
        env:
          PARTITION: ${{ matrix.partition }}
        run: >-
          cargo hack check --feature-powerset --depth 2 --no-dev-deps
          --skip integration,integration-stripe,integration-ws
          --exclude-features reqwest-default-tls,reqwest-native-tls,reqwest-rustls-tls,reqwest-rustls-tls-no-provider
          --partition "$PARTITION"
      - name: Check TLS backends
        if: matrix.partition == '1/3'
        run: |
          for tls in reqwest-default-tls reqwest-native-tls reqwest-rustls-tls reqwest-rustls-tls-no-provider; do
            cargo check --no-default-features --features "client,$tls"
          done

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      # Start the containers in the background so pulling and booting them
      # overlaps the setup below; a later step waits for `up --wait` to finish.
      - name: Start Tempo localnet
        run: (docker compose up -d --wait --quiet-pull > "$RUNNER_TEMP/compose-up.log" 2>&1; echo $? > "$RUNNER_TEMP/compose-up.status") > /dev/null 2>&1 &
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          toolchain: stable
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          # Pull requests restore main's cache but never save their own:
          # saving cost 8-16s at the end of every job.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Compile before waiting, so the build also overlaps the localnet start.
      - name: Build integration tests
        run: cargo test --features integration --test integration_charge --test integration_session --no-run

      - name: Wait for Tempo localnet
        run: |
          for _ in {1..360}; do [[ -s "$RUNNER_TEMP/compose-up.status" ]] && break; sleep 0.5; done
          cat "$RUNNER_TEMP/compose-up.log"
          [[ "$(cat "$RUNNER_TEMP/compose-up.status" 2>/dev/null)" == 0 ]]

      - name: Run integration tests
        run: cargo test --features integration --test integration_charge --test integration_session -- --nocapture

      - name: Stop Tempo localnet
        if: always()
        run: docker compose down

  deny:
    uses: tempoxyz/gh-actions/.github/workflows/rust-deny.yml@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
    with:
      rust-toolchain: nightly
    permissions:
      contents: read
      id-token: write

  ci-gate:
    name: CI Gate
    if: always()
    needs: [lint, typos, test, doctest, features, integration, deny]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi
