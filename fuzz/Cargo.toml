[package]
name = "mpp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[features]
# Targets and checks that need `mpp`'s `server` feature (SSE events).
server = ["mpp/server"]
# Targets and checks that need `mpp`'s `tempo` feature (alloy, tempo-alloy).
tempo = ["server", "mpp/tempo"]
# Assert that every amount parser accepts exactly `0|[1-9][0-9]*`.
strict-amounts = []

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
base64 = "0.22"
libfuzzer-sys = "0.4"
serde = "1"
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }

[dependencies.mpp]
path = ".."
default-features = false

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "fuzz_www_authenticate"
path = "fuzz_targets/fuzz_www_authenticate.rs"
test = false
doc = false
bench = false

