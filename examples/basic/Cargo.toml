[package]
name = "basic-example"
version = "0.3.0"
edition = "2021"
publish = false

[[bin]]
name = "basic-server"
path = "src/server.rs"

[[bin]]
name = "basic-client"
path = "src/client.rs"

[dependencies]
mpp = { path = "../..", features = ["server", "client", "tempo"] }
alloy = { version = "2.0", features = ["provider-http"] }
tempo-alloy = { version = "1.10.1", git = "https://github.com/tempoxyz/tempo", rev = "b5cd0b117d1dd792030cceb09f2a6f18f3c93a42" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
hex = "0.4"
rand = "0.10"
