[files]
# Fuzz seeds contain intentionally malformed and encoded protocol payloads.
extend-exclude = ["fuzz/seeds/**"]

[default]
# Opaque base64/base64url protocol values are not words.
extend-ignore-re = ['"[A-Za-z0-9_+/=-]{24,}"']

[default.extend-words]
# Escaped café test strings and an accepted spelling used in API documentation.
caf = "caf"
unparseable = "unparseable"
